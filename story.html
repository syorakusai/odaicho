<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>御題帳 - 妖怪物語</title>
<meta name="theme-color" content="#211C17">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E8DFC8;
    --paper-card: #F4EFDF;
    --ink: #211C17;
    --ink-soft: #5A5145;
    --ink-faint: #8A806E;
    --seal: #A6332E;
    --seal-dark: #7E2521;
    --line: #C9BD9E;
    --gold: #8C7A4E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100%;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(140,122,78,0.07), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(140,122,78,0.06), transparent 45%);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px calc(100px + env(safe-area-inset-bottom)); }

  .app-nav {
    position: fixed;
    z-index: 1000;
    right: 0; bottom: 0; left: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    padding: 8px max(12px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    border-top: 1px solid var(--line);
    background: rgba(244, 239, 223, 0.96);
    box-shadow: 0 -4px 18px rgba(33, 28, 23, 0.12);
    backdrop-filter: blur(10px);
  }
  .app-nav a {
    display: flex;
    min-height: 44px;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink-soft);
    font-weight: 700;
    text-decoration: none;
    font-size: 14px;
  }
  .app-nav a[aria-current="page"] {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--paper-card);
  }

  /* Sticky header for list view (title + search + today) */
  .list-sticky {
    position: sticky;
    top: 0;
    z-index: 400;
    background: var(--paper);
    padding-top: 18px;
  }

  header.title { text-align: center; padding: 4px 0 14px; }
  header.title h1 {
    font-family: 'Yuji Syuku', serif;
    font-size: 30px;
    margin: 0;
    color: var(--ink);
    letter-spacing: 0.08em;
  }
  header.title p {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
  }
  header.title .rule {
    width: 56px; height: 2px; background: var(--gold);
    margin: 12px auto 0; opacity: 0.6;
  }

  .toolbar { display: flex; gap: 8px; padding-bottom: 12px; }
  .toolbar button, .toolbar .search-box {
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 20px;
    border: 1.3px solid var(--ink);
    background: transparent;
    color: var(--ink);
  }
  .toolbar .search-box {
    flex: 1;
    display: flex; align-items: center; gap: 6px;
    border-color: var(--line);
    background: var(--paper-card);
  }
  .toolbar .search-box input {
    flex: 1;
    border: none; background: transparent; outline: none;
    font-size: 14px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    min-width: 0;
  }
  .toolbar .today-btn {
    background: var(--seal);
    border-color: var(--seal);
    color: #F4EFDF;
    font-weight: 700;
    white-space: nowrap;
  }

  .list { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
  .list-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 13px;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .list-row .no {
    font-family: 'Yuji Syuku', serif;
    font-size: 13px;
    color: var(--gold);
    min-width: 34px;
  }
  .list-row .name {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 15px;
    flex: 1;
  }
  .list-row .arrow { color: var(--ink-faint); font-size: 13px; }
  .list-row.today-hit { border-color: var(--seal); background: rgba(166,51,46,0.06); }
  .list-row.selected { border-color: var(--seal); background: rgba(166,51,46,0.12); box-shadow: 0 0 0 1px var(--seal); }

  .empty {
    text-align: center;
    padding: 30px 10px;
    color: var(--ink-faint);
    font-size: 13px;
    line-height: 1.8;
  }

  /* Detail view */
  #detailView { display: none; padding-top: 14px; }
  .detail-info {
    text-align: center;
    margin-bottom: 10px;
  }
  .detail-info .no {
    font-family: 'Yuji Syuku', serif;
    font-size: 12px;
    color: var(--gold);
    margin-right: 6px;
  }
  .detail-info .name {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 16px;
  }
  .detail-info .postdate {
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-left: 8px;
  }
  .detail-nav-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }
  .detail-nav-row .back-btn {
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 20px;
    border: 1.3px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
  }
  .detail-nav-row button.round {
    font-size: 14px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1.3px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 0;
  }
  .detail-nav-row button.round:disabled { opacity: 0.3; }
  .detail-nav-row .today-btn {
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 20px;
    border: 1.3px solid var(--seal);
    background: var(--seal);
    color: #F4EFDF;
    font-weight: 700;
    white-space: nowrap;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .quad {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .quad .block-label {
    font-family: 'Shippori Mincho', serif;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ink-soft);
    display: flex; align-items: center; gap: 5px;
    margin-bottom: 6px;
  }
  .quad .block-label::before {
    content: '';
    width: 9px; height: 1px;
    background: var(--seal);
    display: inline-block;
    flex-shrink: 0;
  }

  .quad-image {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-card);
    padding: 9px;
    gap: 8px;
  }
  .img-actions-stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .img-actions-stack button {
    width: 100%;
    font-size: 11.5px;
    padding: 8px 6px;
    border-radius: 16px;
    border: 1.3px solid var(--ink);
    background: transparent;
    color: var(--ink);
  }
  .img-actions-stack button#shareBtn {
    background: var(--ink);
    color: var(--paper-card);
  }
  .img-actions-stack button:disabled {
    opacity: 0.35;
  }
  .img-body {
    display: flex;
  }
  .thumb-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .thumb-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .thumb-empty {
    font-size: 9px;
    color: var(--ink-faint);
    text-align: center;
    line-height: 1.4;
    padding: 3px;
  }

  .code-wrap { position: relative; flex: 1; }
  .quad pre {
    margin: 0;
    background: var(--ink);
    color: #F4EFDF;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px;
    line-height: 1.55;
    padding: 32px 8px 8px 8px;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    height: 260px;
    scrollbar-width: thin;
    scrollbar-color: rgba(244,239,223,0.4) transparent;
    box-sizing: border-box;
    overflow-y: auto;
  }
  .quad pre::-webkit-scrollbar {
    width: 5px;
  }
  .quad pre::-webkit-scrollbar-thumb {
    background: rgba(244,239,223,0.4);
    border-radius: 3px;
  }
  .copy-btn {
    position: absolute;
    top: 6px; right: 6px;
    background: rgba(244,239,223,0.15);
    color: #F4EFDF;
    border: 1px solid rgba(244,239,223,0.35);
    border-radius: 12px;
    font-size: 10.5px;
    padding: 5px 10px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  .copy-btn.copied { background: var(--seal); border-color: var(--seal); }
</style>
</head>
<body>
<div class="wrap">

  <!-- LIST VIEW -->
  <div id="listView">
    <div class="list-sticky">
      <header class="title">
        <h1>妖怪物語</h1>
        <p>番号から本文を呼び出す</p>
        <div class="rule"></div>
      </header>
      <div class="toolbar">
        <div class="search-box">
          <input id="jumpInput" type="text" inputmode="numeric" placeholder="番号を入力してジャンプ">
        </div>
        <button class="today-btn" onclick="jumpToday()">今日</button>
      </div>
    </div>
    <div class="list" id="listEl"></div>
    <div class="empty" id="listEmpty">読み込み中…</div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detailView">
    <div class="detail-info">
      <span class="no" id="dNo"></span><span class="name" id="dName"></span><span class="postdate" id="dPostDate"></span>
    </div>
    <div class="detail-nav-row">
      <button class="back-btn" onclick="showList({clearFilter:true})">‹ 一覧へ</button>
      <button class="round" id="prevBtn" onclick="stepDetail(-1)">←</button>
      <button class="round" id="nextBtn" onclick="stepDetail(1)">→</button>
      <button class="today-btn" onclick="jumpToday()">今日</button>
    </div>

    <div class="detail-grid">
      <div class="quad quad-image">
        <div class="block-label">画像</div>
        <div class="img-actions-stack">
          <button id="pickFolderBtn" type="button">フォルダ選択</button>
          <button id="shareBtn" type="button" disabled>共有</button>
        </div>
        <div class="img-body">
          <div class="thumb-wrap" id="thumbWrap">
            <div class="thumb-empty" id="thumbEmpty">フォルダ<br>未選択</div>
            <img id="thumbImg" style="display:none" alt="">
          </div>
        </div>
      </div>

      <div class="quad">
        <div class="block-label">F列（結合）</div>
        <div class="code-wrap">
          <pre id="dF"></pre>
          <button class="copy-btn" data-target="dF">コピー</button>
        </div>
      </div>

      <div class="quad">
        <div class="block-label">R列／【特質】まで</div>
        <div class="code-wrap">
          <pre id="dRBefore"></pre>
          <button class="copy-btn" data-target="dRBefore">コピー</button>
        </div>
      </div>

      <div class="quad">
        <div class="block-label">R列／【特質】以降</div>
        <div class="code-wrap">
          <pre id="dRAfter"></pre>
          <button class="copy-btn" data-target="dRAfter">コピー</button>
        </div>
      </div>
    </div>
    <input type="file" id="folderInput" webkitdirectory multiple style="display:none">
  </div>

</div>

<nav class="app-nav" aria-label="ページ切り替え">
  <a href="./index.html">お題</a>
  <a href="./story.html" aria-current="page">妖怪物語</a>
  <a href="./prompt-copy.html">デザイン</a>
</nav>

<script>
let YOKAI_DATA = [];
let byNo = {};
let sortedNos = [];

const STORAGE_KEY = 'odaicho-story-last';
let currentNo = null;

function todayKey() {
  const now = new Date();
  const yy = String(now.getFullYear()).slice(-2);
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  return yy + '/' + mm + '/' + dd;
}

function renderList(filterText) {
  const el = document.getElementById('listEl');
  const emptyEl = document.getElementById('listEmpty');
  el.innerHTML = '';
  const today = todayKey();
  let shown = 0;
  YOKAI_DATA.forEach(d => {
    if (filterText && !(String(d.no).includes(filterText) || d.name.includes(filterText))) return;
    shown++;
    const row = document.createElement('div');
    row.className = 'list-row' + (d.postDate === today ? ' today-hit' : '');
    row.setAttribute('data-no', d.no);
    row.innerHTML = `
      <div class="no">No.${d.no}</div>
      <div class="name">${escapeHtml(d.name)}</div>
      <div class="arrow">›</div>
    `;
    row.onclick = () => showDetail(d.no);
    el.appendChild(row);
  });
  if (shown === 0) {
    emptyEl.textContent = '該当する妖怪が見つかりません';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showList(opts) {
  opts = opts || {};
  if (opts.clearFilter) document.getElementById('jumpInput').value = '';
  document.getElementById('listView').style.display = 'block';
  document.getElementById('detailView').style.display = 'none';
  renderList(document.getElementById('jumpInput').value.trim());
  if (currentNo !== null) {
    const row = document.querySelector('.list-row[data-no="' + currentNo + '"]');
    if (row) {
      row.classList.add('selected');
      row.scrollIntoView({ block: 'center' });
    }
  }
}

function showDetail(no) {
  const item = byNo[no];
  if (!item) return;
  currentNo = no;
  localStorage.setItem(STORAGE_KEY, String(no));
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';
  document.getElementById('dNo').textContent = 'No.' + item.no;
  document.getElementById('dName').textContent = item.name;
  document.getElementById('dPostDate').textContent = item.postDate && item.postDate !== '-' ? '投稿日 ' + item.postDate : '';
  document.getElementById('dF').textContent = item.f;
  document.getElementById('dRBefore').textContent = item.rBefore;
  document.getElementById('dRAfter').textContent = item.rAfter;

  const idx = sortedNos.indexOf(item.no);
  document.getElementById('prevBtn').disabled = idx <= 0;
  document.getElementById('nextBtn').disabled = idx >= sortedNos.length - 1;
  window.scrollTo(0, 0);
  updateImageForCurrent();
}

function stepDetail(dir) {
  const idx = sortedNos.indexOf(currentNo);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= sortedNos.length) return;
  showDetail(sortedNos[newIdx]);
}

function jumpToInput() {
  const raw = document.getElementById('jumpInput').value.trim();
  const m = raw.match(/\d+/);
  if (!m) { renderList(raw); return; }
  const no = parseInt(m[0], 10);
  if (byNo[no]) {
    showDetail(no);
  } else {
    renderList(raw);
  }
}

function jumpToday() {
  const today = todayKey();
  const hit = YOKAI_DATA.find(d => d.postDate === today);
  if (hit) {
    showDetail(hit.no);
  } else {
    document.getElementById('jumpInput').value = '';
    renderList('');
    alert('本日投稿の妖怪は見つかりませんでした');
  }
}

document.getElementById('jumpInput').addEventListener('input', () => {
  renderList(document.getElementById('jumpInput').value.trim());
});
document.getElementById('jumpInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') jumpToInput();
});

let imageMap = {};
let lastObjectUrl = null;
let folderPicked = false;

document.getElementById('pickFolderBtn').addEventListener('click', () => {
  document.getElementById('folderInput').click();
});

document.getElementById('folderInput').addEventListener('change', (e) => {
  imageMap = {};
  folderPicked = true;
  const files = Array.from(e.target.files);
  files.forEach(f => {
    const m = f.name.match(/^(\d+)/);
    if (m) {
      const no = parseInt(m[1], 10);
      imageMap[no] = f;
    }
  });
  updateImageForCurrent();
});

function updateImageForCurrent() {
  const img = document.getElementById('thumbImg');
  const empty = document.getElementById('thumbEmpty');
  const shareBtn = document.getElementById('shareBtn');
  if (!img) return;
  const file = imageMap[currentNo];
  if (lastObjectUrl) {
    URL.revokeObjectURL(lastObjectUrl);
    lastObjectUrl = null;
  }
  if (file) {
    const url = URL.createObjectURL(file);
    lastObjectUrl = url;
    img.src = url;
    img.style.display = 'block';
    empty.style.display = 'none';
    shareBtn.disabled = false;
    shareBtn.onclick = async () => {
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else {
          alert('この端末では画像の共有に対応していません');
        }
      } catch (err) {
        // ユーザーが共有をキャンセルした場合は何もしない
      }
    };
  } else {
    img.style.display = 'none';
    empty.style.display = 'block';
    empty.innerHTML = folderPicked ? 'この番号<br>画像なし' : 'フォルダ<br>未選択';
    shareBtn.disabled = true;
    shareBtn.onclick = null;
  }
}

document.querySelectorAll('.copy-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const target = document.getElementById(btn.dataset.target);
    try {
      await navigator.clipboard.writeText(target.textContent);
      const orig = btn.textContent;
      btn.textContent = 'コピー済';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
    } catch (e) {
      btn.textContent = '失敗';
    }
  });
});

// init: fetch data, then restore last viewed or show list
async function init() {
  try {
    const res = await fetch('./data/yokai.json', { cache: 'no-store' });
    YOKAI_DATA = await res.json();
  } catch (e) {
    document.getElementById('listEl').innerHTML = '';
    document.getElementById('listEmpty').style.display = 'block';
    document.getElementById('listEmpty').textContent = 'データの読み込みに失敗しました';
    return;
  }
  byNo = {};
  YOKAI_DATA.forEach(d => { byNo[d.no] = d; });
  sortedNos = YOKAI_DATA.map(d => d.no).sort((a, b) => a - b);

  renderList('');
  const last = localStorage.getItem(STORAGE_KEY);
  if (last && byNo[parseInt(last, 10)]) {
    showDetail(parseInt(last, 10));
  } else {
    showList();
  }
}
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}
</script>
</body>
</html>
